<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Contato - Vinheria Agnello</title>
</head>
 
<body>
 
    <!-- Cabeçalho e Navegação Principal -->
    <header>
        <div class="logo">
            <h1>Vinheria Agnello</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../../index.html">Início</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="vinhos.html">Vinhos</a></li>
                <li><a href="harmonizacao.html">Harmonização</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
 
    <!-- Conteúdo Principal -->
    <main>
        <section id="contato-container">
            <h2>Fale Conosco</h2>
            <p>Tem dúvidas sobre algum rótulo ou deseja uma recomendação personalizada de harmonização? Preencha o
                formulário abaixo ou visite a nossa loja física!</p>
            <br>
 
            <!-- Imagem Obrigatória da Página -->
            <div class="contato-imagem">
                <img src="../../img/produto.png" alt="Atendimento na Vinheria Agnello">
            </div>
 
            <!-- Formulário de Contacto Obrigatório -->
            <form action="#" method="post" class="form-contato">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
                </div>
 
                <div class="form-group">
                    <label for="email">E-mail de Contato:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required>
                </div>
 
                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem..."
                        required></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Enviar formulário</button>
                    <button type="reset" class="btn-reset">Limpar formulário</button>
                </div>
            </form>
        </section>
    </main>
</body>
 
</html>
